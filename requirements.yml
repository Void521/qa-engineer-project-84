---
functional:
  - Пользователь должен иметь возможность искать товары по ключевому слову
  - Пользователь должен иметь возможность фильтровать товары по категории и цене
  - Пользователь должен иметь возможность просматривать каталог товаров и подробную информацию о каждом товаре
  - Пользователь должен иметь возможность добавлять товары в корзину и просматривать её содержимое
  - Пользователь должен иметь возможность добавлять товары в корзину и продолжать выбирать товары в каталоге без перехода на страницу корзины
  - Пользователь должен иметь возможность оформить заказ с переходом на страницу оплаты
  - Пользователь должен иметь возможность переключать язык интерфейса между русским и английским
  - В каталоге и на странице товара должны отображаться название, рейтинг, цена со скидкой и первоначальная цена

non-functional:
  - Сайт должен быть удобным для пользователей и оптимизированным по скорости загрузки страниц
  - Сайт должен обеспечивать безопасность и защиту персональных данных пользователя
  - Сайт должен корректно отображаться и работать на мобильных устройствах
  - Сайт должен быть совместим с последними версиями популярных браузеров
  - Сайт должен поддерживать работу при высокой нагрузке и большом количестве одновременных пользователей
  - Сайт должен корректно работать на различных устройствах и экранах
  - Сайт должен поддерживать русский и английский языки
  - Сайт должен быть доступен напрямую из сети Интернет без использования VPN

implicit:
  - При отсутствии результатов поиска или товаров в выбранной категории должно отображаться корректное сообщение
  - Содержимое корзины должно сохраняться при обновлении страницы и повторном входе пользователя
  - Элементы интерфейса должны располагаться в соответствии со спецификацией и корректно отображаться в различных состояниях
  - Все скрипты должны загружаться и выполняться без ошибок в DevTools
