- summary: |
    Поиск товара по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    - Пользователь находится на главной странице интернет-магазина
    - В базе данных есть товар с названием "Dior J'adore"
  test-data: |
    no-data
  steps:
    - Ввести в строку поиска ключевое слово "Dior"
  expected-result: |
    - Результаты подгружаются динамически.
    - Отображается список товаров, содержащих в названии или описании слово "Dior"
    - Товар "Dior J'adore" присутствует в поисковой выдаче

- summary: |
    Фильтрация товаров по одной категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по категориям
  prerequisites: |
    - Пользователь находится на главной странице или в общем каталоге товаров
    - Доступно боковое меню с категориями товаров
  test-data: |
    Выбранная категория: "beauty"
  steps:
    - Перейти в общий каталог товаров.
    - В блоке категорий выбрать пункт "beauty"
  expected-result: |
    - Список товаров на странице обновляется.
    - В выдаче отображаются только товары, относящиеся к категории "beauty"

- summary: |
    Фильтрация товаров по одному производителю (бренду)
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по производителю
  prerequisites: |
    - Пользователь находится на странице категории с товарами разных брендов
    - В блоке фильтров доступен список производителей
  test-data: |
    Выбранный бренд: "Chanel"
  steps:
    - В блоке фильтров найти раздел "Производитель"
    - Установить чекбокс напротив бренда "Chanel"
  expected-result: |
    - Список товаров автоматически обновляется.
    - На странице отображаются только товары от производителя "Chanel"

- summary: |
    Фильтрация товаров по диапазону цен
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по стоимости
  prerequisites: |
    - Пользователь находится на странице каталога
    - Доступен фильтр цены
  test-data: |
    Нижняя граница: 10, Верхняя граница: 90
  steps:
    - В блоке фильтра цены ввести в поле "От" значение "10"
    - В поле "До" ввести значение "90"
  expected-result: |
    - Каталог товаров обновляется в соответствии с фильтром
    - Все отображаемые товары имеют цену не ниже 10 и не выше 90 денежных единиц

- summary: |
    Фильтрация товаров по наличию ("В наличии")
  requirement: |
    Пользователь должен иметь возможность скрывать отсутствующие товары
  prerequisites: |
    - Пользователь находится в каталоге товаров
    - В блоке фильтров присутствует чекбокс наличия
  test-data: |
    no-data
  steps:
    - В блоке фильтров активировать чекбокс "В наличии"
  expected-result: |
    - Список товаров обновляется.
    - Из выдачи пропадают все товары со статусом "Нет в наличии" или "Предзаказ"

- summary: |
    Сочетание фильтров: Производитель + Наличие
  requirement: |
    Пользователь должен иметь возможность комбинировать различные фильтры товаров
  prerequisites: |
    - Пользователь находится на странице категории товаров
    - Доступен блок фильтров с параметрами бренда и наличия
  test-data: |
    Бренд: "Dior"
  steps:
    - В блоке фильтров выбрать производителя "Dior"
    - В этом же блоке активировать чекбокс "В наличии"
  expected-result: |
    - Список товаров обновляется согласно обоим критериям
    - В выдаче присутствуют только товары бренда "Dior", которые сейчас есть на складе

- summary: |
    Сочетание фильтров: Категория + Цена + Производитель
  requirement: |
    Пользователь должен иметь возможность использовать множественную фильтрацию высокой вложенности
  prerequisites: |
    - Пользователь открыл общий каталог интернет-магазина
    - Доступны фильтры по категориям, ценам и брендам
  test-data: |
    Категория: "fragrances", Диапазон цен: 10 - 90, Бренд: "Dior"
  steps:
    - Выбрать категорию товаров "Косметика"
    - В фильтре цен установить диапазон от 10 до 90
    - В фильтре производителей выбрать "Dior"
  expected-result: |
    - Страница успешно фильтрует товары без конфликтов между параметрами
    - Отображаются только косметические средства бренда "Dior", цена которых находится в пределах от 10 до 90

- summary: |
    Просмотр детальной информации о товаре
  requirement: |
    Пользователь должен иметь возможность просматривать подробную информацию о товаре
  prerequisites: |
    - Пользователь находится на странице списка товаров (каталог или результаты поиска)
  test-data: |
    no-data
  steps:
    - Нажать на карточку, изображение или название любого товара
  expected-result: |
    - Осуществляется переход на индивидуальную карточку товара
    - Отображается подробная информация: полное название, цена, рейтинг, описание, галерея изображений

- summary: |
    Добавление товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    - Пользователь находится на карточке товара, который есть в наличии
    - Корзина пользователя изначально пуста
  test-data: |
    no-data
  steps:
    - Нажать кнопку "В корзину"
  expected-result: |
    - Индикатор корзины в шапке сайта обновляется: отображает 1 единицу товара в корзине

- summary: |
    Просмотр содержимого корзины
  requirement: |
    Пользователь должен иметь возможность просматривать содержимое корзины
  prerequisites: |
    - В корзину добавлен как минимум один товар
    - Пользователь находится на любой странице сайта
  test-data: |
    no-data
  steps:
    - Нажать на иконку корзины в шапке сайта для перехода в нее
  expected-result: |
    - Открывается страница корзины
    - Отображается список всех добавленных товаров с их названиями, ценой за единицу, количеством и итоговой стоимостью заказа

- summary: |
    Проверка русской локализации основных разделов сайта
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса на русский
  prerequisites: |
    - Сайт открыт в браузере
    - В шапке сайта доступен переключатель языков (RU/EN/ESP)
    - В каталоге доступны товары
  test-data: |
    язык: RU
  steps:
    - Нажать на переключатель языков и выбрать "RU" (Русский)
    - Открыть каталог товаров и проверить названия товаров, заголовки и элементы интерфейса
    - Проверить названия и элементы блока фильтров, включая категории и цену
    - Добавить товар в корзину
    - Открыть корзину и проверить названия элементов, кнопки и системные сообщения
  expected-result: |
    - Интерфейс сайта отображается на русском языке
    - Названия товаров и элементы каталога отображаются на русском языке
    - Названия фильтров, категорий и элементов управления отображаются на русском языке
    - Корзина отображается на русском языке
    - Названия кнопок, заголовки и системные сообщения переведены на русский язык
    - При переключении языка текущий контекст пользователя не теряется

