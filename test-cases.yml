- summary: |
    Поиск товара по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    - Пользователь находится на главной странице интернет-магазина
    - В базе данных есть товар с названием "Dior J'adore"
  test-data: |
    no-data
  steps:
    - Ввести в строку поиска ключевое слово "Dior"
  expected-result: |
    - Результаты подгружаются динамически.
    - Отображается список товаров, содержащих в названии или описании слово "Dior"
    - Товар "Dior J'adore" присутствует в поисковой выдаче

- summary: |
    Фильтрация товаров по одной категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по категориям
  prerequisites: |
    - Пользователь находится на главной странице или в общем каталоге товаров.
    - Доступно боковое или верхнее меню с категориями товаров.
  test-data: |
    Выбранная категория: "Парфюмерия"
  steps:
    - Перейти в общий каталог товаров.
    - В блоке категорий выбрать пункт "Парфюмерия".
  expected-result: |
    - Список товаров на странице обновляется.
    - В выдаче отображаются только товары, относящиеся к категории "Парфюмерия".

- summary: |
    Фильтрация товаров по одному производителю (бренду)
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по производителю
  prerequisites: |
    - Пользователь находится на странице категории с товарами разных брендов.
    - В блоке фильтров доступен список производителей.
  test-data: |
    Выбранный бренд: "Chanel"
  steps:
    - В блоке фильтров найти раздел "Производитель" (или "Бренд").
    - Установить чекбокс напротив бренда "Chanel".
  expected-result: |
    - Список товаров автоматически обновляется (или после нажатия кнопки "Применить").
    - На странице отображаются только товары от производителя "Chanel".

- summary: |
    Фильтрация товаров по диапазону цен
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по стоимости
  prerequisites: |
    - Пользователь находится на странице каталога.
    - Доступен фильтр цены (поля ввода "От/До" или ползунок-слайдер).
  test-data: |
    Нижняя граница: 1500, Верхняя граница: 5000
  steps:
    - В блоке фильтра цены ввести в поле "От" значение "1500".
    - В поле "До" ввести значение "5000".
  expected-result: |
    - Каталог товаров обновляется в соответствии с фильтром.
    - Все отображаемые товары имеют цену не ниже 1500 и не выше 5000 денежных единиц.

- summary: |
    Фильтрация товаров по наличию ("В наличии")
  requirement: |
    Пользователь должен иметь возможность скрывать отсутствующие товары
  prerequisites: |
    - Пользователь находится в каталоге товаров.
    - В блоке фильтров присутствует переключатель/чекбокс наличия.
  test-data: |
    no-data
  steps:
    - В блоке фильтров активировать чекбокс "В наличии" (или "Доступно для заказа").
  expected-result: |
    - Список товаров обновляется.
    - Из выдачи пропадают все товары со статусом "Нет в наличии" или "Предзаказ".

- summary: |
    Сочетание фильтров: Производитель + Наличие
  requirement: |
    Пользователь должен иметь возможность комбинировать различные фильтры товаров
  prerequisites: |
    - Пользователь находится на странице категории товаров.
    - Доступен блок фильтров с параметрами бренда и наличия.
  test-data: |
    Бренд: "Dior"
  steps:
    - В блоке фильтров выбрать производителя "Dior".
    - В этом же блоке активировать чекбокс "В наличии".
  expected-result: |
    - Список товаров обновляется согласно обоим критериям.
    - В выдаче присутствуют только товары бренда "Dior", которые сейчас есть на складе.

- summary: |
    Сочетание фильтров: Категория + Цена + Производитель
  requirement: |
    Пользователь должен иметь возможность использовать множественную фильтрацию высокой вложенности
  prerequisites: |
    - Пользователь открыл общий каталог интернет-магазина.
    - Доступны фильтры по категориям, ценам и брендам.
  test-data: |
    Категория: "Косметика", Диапазон цен: 500 - 2000, Бренд: "L'Oreal"
  steps:
    - Выбрать категорию товаров "Косметика".
    - В фильтре цен установить диапазон от 500 до 2000.
    - В фильтре производителей выбрать "L'Oreal".
  expected-result: |
    - Страница успешно фильтрует товары без конфликтов между параметрами.
    - Отображаются только косметические средства бренда "L'Oreal", цена которых находится в пределах от 500 до 2000.


- summary: |
    Фильтрация товаров по параметрам
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    - Пользователь находится на странице категории или результатов поиска с множеством товаров.
    - Доступен блок фильтров (например, по цене, бренду, наличию)
  test-data: |
    no-data
  steps:
    - В блоке фильтров выбрать бренд "Dior"
    - Установить диапазон цен от 10 до 90
  expected-result: |
    - Список товаров на странице обновляется согласно заданным параметрам
    - В выдаче остаются только товары бренда "Dior", стоимость которых входит в указанный диапазон

- summary: |
    Просмотр детальной информации о товаре
  requirement: |
    Пользователь должен иметь возможность просматривать подробную информацию о товаре
  prerequisites: |
    - Пользователь находится на странице списка товаров (каталог или результаты поиска)
  test-data: |
    no-data
  steps:
    - Нажать на карточку, изображение или название любого товара.
  expected-result: |
    - Осуществляется переход на индивидуальную карточку товара.
    - Отображается подробная информация: полное название, цена, описание, галерея изображений

- summary: |
    Добавление товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    - Пользователь находится на карточке товара, который есть в наличии
    - Корзина пользователя изначально пуста
  test-data: |
    no-data
  steps:
    - Нажать кнопку "В корзину"
  expected-result: |
    - Индикатор корзины в шапке сайта обновляется: отображает 1 единицу товара в корзине

- summary: |
    Просмотр содержимого корзины
  requirement: |
    Пользователь должен иметь возможность просматривать содержимое корзины
  prerequisites: |
    - В корзину добавлен как минимум один товар
    - Пользователь находится на любой странице сайта
  test-data: |
    no-data
  steps:
    - Нажать на иконку корзины в шапке сайта для перехода в нее
  expected-result: |
    - Открывается страница корзины
    - Отображается список всех добавленных товаров с их названиями, ценой за единицу, количеством и итоговой стоимостью заказа

- summary: |
    Переключение языка интерфейса
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    - Сайт изначально открыт на русском языке.
    - В шапке сайта доступен переключатель языков (RU/EN/ESP)
  test-data: |
    no-data
  steps:
    - Нажать на переключатель языков и выбрать "EN" (English)
  expected-result: |
    - Страница перерисовывается без потери текущего контекста (пользователь остается на той же странице)
    - Элементы интерфейса (меню, кнопки, системные сообщения, заголовки) переводятся на английский язык

- summary: |
    Мобильная версия интернет-магазина
  requirement: |
    Проверка доступности на различных мобильных устройствах и планшетах
  prerequisites: |
    - Тестирование на смартфонах (iOS / Android) с разным разрешением экранов
  test-data: |
    no-data
  steps:
    - Открыть сайт на мобильном устройстве
    - Проверить адаптивность элементов (меню, карточки товаров, корзину)
  expected-result: |
    - Сайт имеет адаптированную под тач-интерфейсы мобильную версию
    - Контент масштабируется под экраны без горизонтального скролла

- summary: |
    Прямой доступ из сети Интернет без VPN
  requirement: |
    Проверка доступности ресурсов сайта без использования прокси-серверов
  prerequisites: |
    - VPN-сервисы и прокси на тестовом устройстве отключены
  test-data: |
    no-data
  steps:
    - Ввести URL-адрес сайта в адресную строку браузера
    - Проверить доступность интернет-магазина и загрузку всех элементов (картинки, шрифты, скрипты)
  expected-result: |
    - Сайт и все его ресурсы успешно загружаются по прямому соединению

- summary: |
    Корректность расположения элементов интерфейса согласно их спецификации, контекстным состояниям и логике работы конкретного UI-компонента
  requirement: |
    Проверка корректного отображения элементов в корзине с четырьмя товарами
  prerequisites: |
    - В корзину добавлены 4 товара
    - Корзина открыта
  test-data: |
    no-data
  steps:
    - Визуально оценить расположение элементов интерфейса согласно контекстным состояниям и логике работы корзины
  expected-result: |
    - Нет наложений текста или смещения элементов

- summary: |
    Проверка работы скрипта оформления заказа
  requirement: |
    Проверка работы скрипта оформления заказа
  prerequisites: |
    - В корзину добавлен как минимум один товар
    - Открыта корзина
    - Открыта панель разработчика DevTools (вкладка Network)
  test-data: |
    no-data
  steps:
    - Нажать на кнопку "Оформить заказ"
  expected-result: |
    - Скрипт orders /api выдает статус 200 OK в DevTools

- summary: |
    Проверка работы закрытия окна "Заказ успешно оформлен"
  requirement: |
    Проверка работы закрытия окна "Заказ успешно оформлен" через элемент интерфейса "крестик" в правом верхнем углу окна
  prerequisites: |
    - В корзину добавлен как минимум один товар
    - Открыта корзина
    - Нажата кнопка "Оформить заказ"
  test-data: |
    no-data
  steps:
    - Закрыть окно "Заказ успешно оформлен", нажав на "крестик" в правом верхнем углу окна
  expected-result: |
    - Окно "Заказ успешно оформлен" закрывается

- summary: |
    Корректность расположения элементов интерфейса согласно их спецификации, контекстным состояниям и логике работы конкретного UI-компонента
  requirement: |
    Проверка корректного отображения элементов в окне "Заказ успешно оформлен"
  prerequisites: |
    - В корзину добавлены 4 товара
    - Корзина открыта
    - Нажата кнопка "Оформить заказ"
  test-data: |
    no-data
  steps:
    - Визуально оценить расположение элементов интерфейса согласно контекстным состояниям и логике работы окна "Заказ успешно оформлен"
  expected-result: |
    - Нет наложений текста или смещения элементов

- summary: |
    Корректность расположения элементов интерфейса согласно их спецификации, контекстным состояниям и логике работы конкретного UI-компонента
  requirement: |
    Проверка корректного отображения элементов в меню "Язык"
  prerequisites: |
    - Нажать "Язык" для выбора языка
  test-data: |
    no-data
  steps:
    - Визуально оценить расположение элементов интерфейса согласно контекстным состояниям и логике работы меню "Язык"
  expected-result: |
    - Отображается 3 языка: английский, русский, испанский, и слева у каждого языка отображается флаг страны, к которой относится язык
    - Названия языков не дублируются
