- summary: |
    Поиск товара по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites:
   - Пользователь находится на главной странице интернет-магазина.
   - В базе данных есть товар с названием "iPhone 6"
  steps:
    - Ввести в строку поиска ключевое слово "iPhone".
    - Нажать кнопку поиска или клавишу Enter.
  expected-result: |
    - Результаты подгружаются динамически.
    - Отображается список товаров, содержащих в названии или описании слово "iPhone".
    - Товар "iPhone 6" присутствует в поисковой выдаче.

- summary: |
    Фильтрация товаров по параметрам
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites:
    - Пользователь находится на странице категории или результатов поиска с множеством товаров.
    - Доступен блок фильтров (например, по цене, бренду, наличию)
  steps:
    - В блоке фильтров выбрать бренд "Dior".
    - Установить диапазон цен от 10 до 90.
  expected-result: |
    - Список товаров на странице обновляется согласно заданным параметрам.
    - В выдаче остаются только товары бренда "Dior", стоимость которых входит в указанный диапазон. 

- summary: |
    Просмотр детальной информации о товаре
  requirement: |
    Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
  prerequisites:
    - Пользователь находится на странице списка товаров (каталог или результаты поиска)
  steps:
   - Нажать на карточку, изображение или название любого товара.
  expected-result: |
   - Осуществляется переход на индивидуальную карточку товара.
   - Отображается подробная информация: полное название, цена, описание, галерея изображений.

- summary: |
    Добавление товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites:
    - Пользователь находится на карточке товара, который есть в наличии.
    - Корзина пользователя изначально пуста.
  steps:
   - Нажать кнопку "В корзину".
  expected-result: |
    - Индикатор корзины в шапке сайта обновляется: отображает 1 единицу товара в корзине

- summary: |
    Просмотр содержимого корзины
  requirement: |
    Пользователь должен иметь возможность просматривать содержимое корзины
  prerequisites:
    - В корзину добавлен как минимум один товар.
    - Пользователь находится на любой странице сайта.
  steps:
   - Нажать на иконку корзины в шапке сайта для перехода в нее.
  expected-result: |
    - Открывается страница корзины.
    - Отображается список всех добавленных товаров с их названиями, ценой за единицу, количеством и итоговой стоимостью заказа.  

- summary: |
    Переключение языка интерфейса
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites:
    - Сайт изначально открыт на русском языке.
    - В шапке сайта доступен переключатель языков (RU/EN/ESP).
  steps:
   - Нажать на переключатель языков и выбрать "EN" (English).
  expected-result: |
    - Страница перерисовывается без потери текущего контекста (пользователь остается на той же странице).
    - Элементы интерфейса (меню, кнопки, системные сообщения, заголовки) переводятся на английский язык.

- summary: |
    Мобильная версия интернет-магазина
  requirement: |
    Проверка доступности на различных мобильных устройствах и планшетах
  prerequisites:
    - Тестирование на смартфонах (iOS / Android) с разным разрешением экранов.
  steps:
   - Открыть сайт на мобильном устройстве.
   - Проверить адаптивность элементов (меню, карточки товаров, корзину).
  expected-result: |
    - Сайт имеет адаптированную под тач-интерфейсы мобильную версию.
    - Контент масштабируется под экраны без горизонтального скролла.

- summary: |
    Прямой доступ из сети Интернет без VPN
  requirement: |
    Проверка доступности ресурсов сайта без использования прокси-серверов
  prerequisites:
    - VPN-сервисы и прокси на тестовом устройстве отключены.
  steps:
    - Ввести URL-адрес сайта в адресную строку браузера.
    - Проверить доступность интернет-магазина и загрузку всех элементов (картинки, шрифты, скрипты).
  expected-result: |
    - Сайт и все его ресурсы успешно загружаются по прямому соединению.

- summary: |
    Корректность расположения элементов интерфейса согласно их спецификации, контекстным состояниям и логике работы конкретного UI-компонента
  requirement: |
    Проверка корректного отображения элементов в корзине с четыремя товарами
  prerequisites:
    - В корзину добавлены 4 товара.
    - Корзина открыта
  steps:
    - Визуально оценить расположение элементов интерфейса, согласно контекстным состояниям и логике работы корзины.
  expected-result: |
    -  Нет наложений текста или смещения элементов.

- summary: |
    Проверка работы скрипта оформление заказа
  requirement: |
    Проверка работы скрипта оформление заказа
  prerequisites:
    - В корзину добавлен как минимум один товар.
    - Открыта корзина.
    - Открыта панель разработчика DevTools (вкладка Network).
  steps:
   - Нажать на кнопку "Оформить заказ".
  expected-result: |
    - Скрипт orders /api выдаёт статус 200 ОК в DevTools.

- summary: |
    Проверка работы закрытия окна "Заказ успешно оформлен"
  requirement: |
    Проверка работы закрытия окна "Заказ успешно формлен" через элемент интерфейса "крестик" в правом верхнем углу окна
  prerequisites:
    - В корзину добавлен как минимум один товар
    - Открыта корзина
    - Нажата кнопка "Оформить заказ"
  steps:
   - Закрыть окно "Заказ успешно формлен" нажав на "крестик" в правом верхнем углу окна
  expected-result: |
    - Окно "Заказ успешно формлен" закрывается 

- summary: |
    Корректность расположения элементов интерфейса согласно их спецификации, контекстным состояниям и логике работы конкретного UI-компонента
  requirement: |
    Проверка корректного отображения элементов в окне "Заказ успешно формлен"
  prerequisites:
    - В корзину добавлены 4 товара.
    - Корзина открыта
    - Нажата кнопка "Оформить заказ"
  steps:
    - Визуально оценить расположение элементов интерфейса, согласно контекстным состояниям и логике работы окна "Заказ успешно формлен".
  expected-result: |
    -  Нет наложений текста или смещения элементов.


    

    
