    - Страница остаётся работоспособной
    - В консоли браузера не появляются ошибки, связанные с выполнением поиска

- summary: |
    Негативная проверка фильтрации товаров при отсутствии результатов
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по категории и цене
  prerequisites: |
    - Открыт сайт интернет-магазина
    - В каталоге доступен блок фильтров по категории и цене
  test-data: |
    price_min: 999999
    price_max: 1000000
  steps:
    - Открыть каталог товаров
    - Установить минимальную цену 999999
    - Установить максимальную цену 1000000
    - Применить фильтры
    - Проверить отображаемые результаты
    - Сбросить фильтры
    - Проверить восстановление каталога
  expected-result: |
    - Фильтры применяются без ошибок
    - Если товаров в заданном ценовом диапазоне нет, отображается пустой результат или понятное сообщение
    - Товары за пределами заданного диапазона не отображаются
    - После сброса фильтров каталог возвращается к исходному состоянию
    - Страница остаётся работоспособной
