    - В корзине находятся как минимум два разных товара
  test-data: |
    product_to_remove: Первый доступный товар
    product_to_keep: Второй доступный товар
  steps:
    - Открыть корзину
    - Найти первый товар
    - Нажать кнопку удаления рядом с первым товаром
    - Проверить содержимое корзины
    - Проверить итоговую стоимость
