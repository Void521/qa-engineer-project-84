    - Открыть каталог товаров
    - Зафиксировать товары, отображаемые на первой странице
    - Нажать кнопку перехода на следующую страницу
    - Проверить отображаемые товары
    - Вернуться на предыдущую страницу
    - Проверить содержимое первой страницы
