- summary: |
    Проверка мобильной версии интернет-магазина при разрешении экрана 375x667
  requirement: |
    Сайт должен корректно отображаться и обеспечивать возможность оформления заказа на мобильных устройствах
  prerequisites: |
    - Интернет-магазин доступен в браузере
    - Каталог содержит товары
    - Пользователь находится на главной странице сайта
  test-data: |
    screen-resolution: 375x667
  steps:
    - Открыть сайт на мобильном устройстве или в режиме эмуляции мобильного устройства с разрешением 375x667
    - Проверить отображение главной страницы, меню навигации и каталога товаров
    - Проверить отсутствие горизонтальной прокрутки и обрезанных элементов интерфейса
    - Открыть блок фильтров и установить фильтр по категории и цене
    - Применить фильтры и проверить отображение подходящих товаров
    - Открыть карточку товара и проверить отображение изображения, названия, рейтинга и цены
    - Добавить товар в корзину
    - Перейти в корзину и проверить наличие добавленного товара и корректность отображения его данных
    - Изменить количество товара в корзине
    - Нажать кнопку оформления заказа
    - Проверить отображение страницы оформления заказа
  expected-result: |
    - Сайт корректно отображается при разрешении экрана 375x667
    - Элементы интерфейса адаптированы под небольшую ширину экрана
    - Горизонтальная прокрутка отсутствует
    - Каталог товаров, фильтры и карточки товаров отображаются корректно
    - Фильтры работают корректно и не перекрывают другие элементы интерфейса
    - Информация о товаре отображается полностью и не обрезается
    - Товар успешно добавляется в корзину
    - Корзина корректно отображает добавленный товар и его данные
    - Пользователь может перейти к оформлению заказа без ошибок отображения интерфейса

- summary: |
    Проверка мобильной версии интернет-магазина при разрешении экрана 440x956
  requirement: |
    Сайт должен корректно отображаться на мобильных устройствах с различными разрешениями экрана и поддерживать основные пользовательские сценарии покупки
  prerequisites: |
    - Интернет-магазин доступен в браузере
    - Каталог содержит товары
    - Пользователь находится на главной странице сайта
  test-data: |
    screen-resolution: 440x956
  steps:
    - Открыть сайт на мобильном устройстве или в режиме эмуляции мобильного устройства с разрешением 440x956
    - Проверить отображение главной страницы, меню навигации и каталога товаров
    - Проверить отсутствие горизонтальной прокрутки и корректность расположения элементов интерфейса
    - Открыть блок фильтров и установить фильтр по категории и цене
    - Применить фильтры и проверить соответствие отображаемых товаров заданным условиям
    - Открыть карточку товара и проверить отображение изображения, названия, рейтинга, цены со скидкой и первоначальной цены
    - Добавить товар в корзину и убедиться
    - Продолжить просмотр каталога и добавить ещё один товар в корзину
    - Перейти в корзину и проверить наличие обоих товаров
    - Проверить отображение количества товаров, цен и итоговой суммы
    - Нажать кнопку оформления заказа
    - Проверить отображение страницы оформления заказа
  expected-result: |
    - Сайт корректно отображается при разрешении экрана 440x956
    - Контент адаптируется под ширину и высоту экрана
    - Горизонтальная прокрутка отсутствует
    - Каталог, фильтры и карточки товаров отображаются без наложения элементов
    - Фильтры корректно применяются и отображают подходящие товары
    - Информация о товарах отображается полностью
    - Пользователь может добавлять несколько товаров в корзину и продолжать покупки
    - Корзина корректно отображает все добавленные товары, их количество и стоимость
    - Пользователь может перейти к оформлению заказа без ошибок отображения интерфейса

