- summary: |
   Не закрывается окно "Заказ успешно оформлен" через "крестик" в правом верхнем углу
  environment: |
    Google Chrome	154.0.8037.98 (Официальная сборка) (64 бит)
    ОС Windows 10 Pro 22H2
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина https://products-store.hexlet.app/
    2. Добавить в корзину товар
    3. Открыть корзину
    4. Нажать "Оформить заказ"
    5. Нажать на "крестик" в правом верхнем углу 
