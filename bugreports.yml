---
- summary: |
   Не корректное отображениен элементов в корзине
  environment: |
    Google Chrome	154.0.8037.98 (Официальная сборка) (64 бит)
    ОС Windows 10 Pro 22H2
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина https://products-store.hexlet.app/
    2. Добавить в корзину более двух разных товаров
    3. Открыть корзину
  expected-result: |
    Нет наложений текста или смещения элементов.
  actual-result: |
    После второго товара, у всех остальных товаров количество смещается хаотично влево
    Ошибка изображена на скриншоте assets/bug_cart.jpg

- summary: |
    Изменяется url в адресной строке браузера, не работают вкладки LOBBY/TOURNAMENT/COMPLETED GAMES
  environment: |
    Google Chrome	154.0.8037.98 (Официальная сборка) (64 бит)
    ОС Windows 10 Pro 22H2
  steps-to-reproduce: |
    1. Залогиниться в системе https://codebattle.hexlet.io/session/new?locale=en&next=%2F
    2. Переключить Лидерборд по сроку (месяц/неделя/за все время)
    3. Переключить LOBBY/TOURNAMENT/COMPLETED GAMES
  expected-result: |
    В адресной строке url не меняется
    Вкладки работают
  actual-result: |
    При нажатии на week,month,all в urlHash появляется '!'
    Вкладки не работают
    Ошибка изображена на скриншоте assets/bug.png
