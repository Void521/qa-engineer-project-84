- summary: |
   Не корректное отображение элементов в меню "Язык"
  environment: |
    Google Chrome	154.0.8037.98 (Официальная сборка) (64 бит)
    ОС Windows 10 Pro 22H2
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина https://products-store.hexlet.app/
    2. Нажать "Язык"
  expected-result: |
    - Отображается 3 языка: Английский, Русский, Испанский и слева у каждого языка отбражается флаг страны к которой относится язык
    - Название языков не дублируется
  actual-result: |
    У английского языка не загружается флаг
    Название "английский" дублируется в правую сторону
    Ошибка изображена на скриншоте https://github.com/Void521/qa-engineer-project-84/blob/main/screenshots/bug_language.png

- summary: |
   Не полная локализация для русского языка элементов интернет-магазина
  environment: |
    Google Chrome	154.0.8037.98 (Официальная сборка) (64 бит)
    ОС Windows 10 Pro 22H2
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина https://products-store.hexlet.app/
    2. Нажать на переключатель языков и выбрать "RU" (Русский)
  expected-result: |
    - Интерфейс сайта отображается на русском языке
    - Названия фильтров, категорий и элементов управления отображаются на русском языке
  actual-result: |
    Названия категорий написаны на англйском языке

