- summary: |
    Некорректно работает фильтрация по ценам
  environment: |
    Google Chrome 154.0.8037.98 (Официальная сборка) (64 бит)
    ОС Windows 10 Pro 22H2
  steps-to-reproduce: |
    1. Перейти на страницу интернет-магазина https://products-store.hexlet.app/
    2. В блоке фильтра цены ввести в поле "От" значение "10"
    3. В поле "До" ввести значение "90"
  expected-result: |
    Все отображаемые товары имеют цену не ниже 10 и не выше 90 денежных единиц
  actual-result: |
    Фильтрация работает только по старым ценам, которые зачёркнуты
    Фильтрация не работает по новым актуальным ценам

- summary: |
    Кликабельная область карточки товара превышает её визуальные границы
  environment: |
    Google Chrome 154.0.8037.98 (Официальная сборка) (64 бит)
    ОС Windows 10 Pro 22H2
  steps-to-reproduce: |
    1. Перейти на страницу интернет-магазина https://products-store.hexlet.app/
    2. Найти любую карточку товара на главной странице или в каталоге
    3. Навести курсор мыши на свободную область (фон сайта) рядом с границей карточки товара
    4. Кликнуть левой кнопкой мыши по этой области
  expected-result: |
    Клик по свободному фону страницы игнорируется 
    Переход в карточку товара происходит только при клике строго внутри визуальных границ самой карточки. Курсор в виде "указательного пальца" (pointer) появляется только над карточкой
  actual-result: |
    Происходит переход на страницу товара при клике на пустую область за пределами карточки 
    Кликабельная область ссылки товара некорректно растянута и выходит за рамки визуального элемента
    Ошибка изображена на скриншотах https://github.com/Void521/qa-engineer-project-84/blob/main/screenshots/bug_product_info1.png
                                    https://github.com/Void521/qa-engineer-project-84/blob/main/screenshots/bug_product_info2.png
                                    https://github.com/Void521/qa-engineer-project-84/blob/main/screenshots/bug_product_info3.png

- summary: |
    Не работает поиск и фильтрация товаров по всему каталогу
  environment: |
    Google Chrome 154.0.8037.98 (Официальная сборка) (64 бит)
    ОС Windows 10 Pro 22H2
  steps-to-reproduce: |
    1. Перейти на страницу интернет-магазина https://products-store.hexlet.app/
    2. Ввести в поисковую строку валидное название товара (например, "Свитшот") и нажать клавишу Enter или иконку поиска.
    3. Очистить строку поиска и зайти в общий каталог товаров.
    4. В блоке фильтров выбрать любой параметр (например, конкретный бренд или категорию).
  expected-result: |
    При поиске отображаются только релевантные товары, соответствующие поисковому запросу.
    При фильтрации отображаются только те товары, которые соответствуют выбранным параметрам фильтра.
  actual-result: |
    Поиск не реагирует на ввод запроса, список товаров не обновляется (или становится полностью пустым).
    При выборе чекбоксов фильтрации каталог товаров никак не меняется, фильтры не применяются ко всему списку.
                                    

