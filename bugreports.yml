---
- summary: |
   Не корректное отображениен элементов в корзине
  environment: |
    Google Chrome	154.0.8037.98 (Официальная сборка) (64 бит)
    ОС Windows 10 Pro 22H2
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина https://products-store.hexlet.app/
    2. Добавить в корзину четыре разных товара
    3. Открыть корзину
  expected-result: |
    Нет наложений текста или смещения элементов
  actual-result: |
    После второго товара, у всех остальных товаров количество начинает смещаться хаотично влево
    Ошибка изображена на скриншоте https://github.com/Void521/qa-engineer-project-84/blob/main/bug_cart.png

- summary: |
    Ошибка загрузки скрипта оформления заказа
  environment: |
    Google Chrome	154.0.8037.98 (Официальная сборка) (64 бит)
    ОС Windows 10 Pro 22H2
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина https://products-store.hexlet.app/
    2. Добавить в корзину любое количество товаров
    3. Открыть корзину
    4. Нажать кнопку оформить заказ
  expected-result: |
    Скрипт orders /api выдаёт статус 200 ОК в DevTools вкладка Network
    Заказ успешно оформляется
  actual-result: |
    Скрипт orders /api выдаёт ошибку 500 Internal Server Error в DevTools вкладка Network
    Заказ не оформляется
    Ошибка изображена на скриншоте https://github.com/Void521/qa-engineer-project-84/blob/main/bug%20orders%20api%20500%20DevTools.png

