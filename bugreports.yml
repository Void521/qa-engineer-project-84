- summary: |
   Не работает поиск по ключевому слову по всему каталогу
  environment: |
    Google Chrome	154.0.8037.98 (Официальная сборка) (64 бит)
    ОС Windows 10 Pro 22H2
  steps-to-reproduce: |
    1. Перейти на страницу интернет-магазина https://products-store.hexlet.app/
    2. Ввести в строку поиска ключевое слово "Lemon"
  expected-result: |
    Отображается список товаров, содержащих в названии или описании слово "Lemon"
  actual-result: |
    Отображается сообщение "Ничего не найдено!"
    
