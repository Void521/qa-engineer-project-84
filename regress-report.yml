bugreports:
  - summary: |
      Некорректное отображение элементов в корзине
    environment: |
      Google Chrome 154.0.8037.98 (Официальная сборка) (64 бит)
      ОС Windows 10 Pro 22H2
    steps-to-reproduce: |
      1. Зайти на страницу интернет-магазина https://products-store-v2.hexlet.app/
      2. Добавить в корзину четыре разных товара
      3. Открыть корзину
    expected-result: |
      Нет наложений текста или смещения элементов
    actual-result: |
      После первого товара у всех остальных товаров кнопка "Удалить" смещена влево.
      Ошибка изображена на скриншоте https://github.com/Void521/qa-engineer-project-84/blob/main/NEW_%20bug_cartV2.png

  - summary: |
      Некорректное отображение элементов в меню "Язык"
    environment: |
      Google Chrome 154.0.8037.98 (Официальная сборка) (64 бит)
      ОС Windows 10 Pro 22H2
    steps-to-reproduce: |
      1. Зайти на страницу интернет-магазина https://products-store-v2.hexlet.app/
      2. Нажать "Язык"
    expected-result: |
      - Отображается 3 языка: английский, русский, испанский, и слева у каждого языка отображается флаг страны, к которой относится язык
      - Названия языков не дублируются
    actual-result: |
      У всех трёх языков (английский, русский, испанский) слева не отображаются флаги стран, к которым они относятся.
      Ошибка изображена на скриншоте https://github.com/Void521/qa-engineer-project-84/blob/main/NEW_bug_languageV2.png

