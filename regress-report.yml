bugreports:
  - summary: |
      Некорректное отображение элементов в корзине
    environment: |
      Google Chrome 154.0.8037.98 (Официальная сборка) (64 бит)
      ОС Windows 10 Pro 22H2
    steps-to-reproduce: |
      1. Перейти на сайт https://products-store-v2.hexlet.app/
      2. Добавить в корзину 4 разных товара.
      3. Открыть корзину.
    expected-result: |
      Элементы интерфейса отображаются корректно, наложения текста и смещения кнопок отсутствуют.
    actual-result: |
      У второго и последующих товаров в списке кнопка "Удалить" смещается влево.
      Скриншот: https://github.com

  - summary: |
      Некорректное отображение элементов в выпадающем меню "Язык"
    environment: |
      Google Chrome 154.0.8037.98 (Официальная сборка) (64 бит)
      ОС Windows 10 Pro 22H2
    steps-to-reproduce: |
      1. Перейти на сайт https://products-store-v2.hexlet.app/
      2. Нажать на кнопку выбора языка в шапке сайта.
    expected-result: |
      В меню отображаются три доступных языка (English, Русский, Español), слева от названия каждого языка присутствует иконка флага соответствующей страны. Названия не дублируются.
    actual-result: |
      У всех трех языков отсутствуют иконки флагов стран.
      Скриншот: https://github.com/Void521/qa-engineer-project-84/blob/main/NEW_bug_languageV2.png

  - summary: |
      Ошибка при поиске товара по ключевому слову
    environment: |
      Google Chrome 154.0.8037.98 (Официальная сборка) (64 бит)
      ОС Windows 10 Pro 22H2
    steps-to-reproduce: |
      1. Перейти на сайт https://products-store-v2.hexlet.app/
      2. Ввести валидное ключевое слово существующего товара в поисковую строку.
      3. Нажать кнопку поиска.
    expected-result: |
      Отображаются товары, соответствующие поисковому запросу.
    actual-result: |
      Поиск не возвращает результаты или завершается ошибкой (кнопка не реагирует / ложное отсутствие результатов).

  - summary: |
      Отсутствует или работает некорректно русская и испанская локализация сайта
    environment: |
      Google Chrome 154.0.8037.98 (Официальная сборка) (64 бит)
      ОС Windows 10 Pro 22H2
    steps-to-reproduce: |
      1. Перейти на сайт https://products-store-v2.hexlet.app/
      2. Переключить интерфейс сайта на русский язык, затем на испанский язык.
      3. Проверить перевод основных разделов (Каталог, Корзина, Описание).
    expected-result: |
      Все элементы основных разделов сайта успешно переводятся на выбранный язык (русский/испанский).
    actual-result: |
      Основные разделы остаются на английском языке или перевод выполнен частично/некорректно.

  - summary: |
      Критический сбой скрипта оформления заказа и некорректное модальное окно успешного заказа
    environment: |
      Google Chrome 154.0.8037.98 (Официальная сборка) (64 бит)
      ОС Windows 10 Pro 22H2
    steps-to-reproduce: |
      1. Перейти на сайт https://products-store-v2.hexlet.app/
      2. Добавить товар в корзину и перейти к оформлению.
      3. Заполнить обязательные поля и нажать кнопку "Оформить заказ".
      4. Попытаться закрыть появившееся окно "Заказ успешно оформлен".
    expected-result: |
      - Скрипт заказа отрабатывает без ошибок.
      - Всплывающее окно "Заказ успешно оформлен" отображается ровно, элементы не съезжают.
      - Окно закрывается при клике на крестик или кнопку закрытия.
    actual-result: |
      Скрипт падает с ошибкой, элементы внутри финального модального окна накладываются друг на друга, а кнопка/крестик закрытия окна не реагируют на нажатие.
